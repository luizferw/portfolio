name = "luizwitt-contact"
main = "src/index.ts"
compatibility_date = "2025-07-01"
workers_dev = false

[[routes]]
pattern = "api.luizwitt.dev"
custom_domain = true

[vars]
CORS_ORIGIN = "https://luizwitt.dev"
TURNSTILE_EXPECTED_HOSTNAME = "luizwitt.dev"
RESEND_FROM = "Luiz Witt <contato@luizwitt.dev>"
RESEND_TO = "contato@luizwitt.dev"
